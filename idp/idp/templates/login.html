{% extends "base.html" %}
{% block body %}
<h1>Sign in</h1>
<p class="sub">{% if site %}to continue to <b>{{ site }}</b>{% else %}to your account{% endif %}</p>
<form method="post" action="{{ url_for('.login') }}">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="username" value="{{ email }}" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  {% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
  <button type="submit">Sign in</button>
</form>
{% endblock %}
