<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sign in{% endblock %}</title>
  <style>
    :root { --bg: #f5f6f8; --card: #fff; --ink: #1c2330; --muted: #6a7384; --line: #e2e5ea; --accent: #2f6fdb; --bad: #d23c3c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1318; --card: #171c23; --ink: #e6e9ee; --muted: #8d96a6; --line: #262d37; --accent: #5b93f0; --bad: #f06363; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 20px; }
    label { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 6px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button, .btn { display: inline-block; width: 100%; margin-top: 20px; padding: 10px; border: 0; border-radius: 8px; background: var(--accent);
      color: #fff; font: inherit; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; }
    .err { color: var(--bad); margin: 12px 0 0; }
    ul { padding-left: 18px; } a { color: var(--accent); }
    .muted { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body><main class="card">{% block body %}{% endblock %}</main></body>
</html>
