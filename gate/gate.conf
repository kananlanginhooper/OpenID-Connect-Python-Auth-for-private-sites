# Every request needs a signed-in user; the site behind (UPSTREAM) gets the user as OIDC_CLAIM_* headers and REMOTE_USER.
ServerName gate
LogLevel warn auth_openidc:info

# Discovery comes from the provider over the compose network (?internal=1), so the server-to-server calls (token,
# userinfo, jwks) go to IDP_INTERNAL_URL while browsers are sent to the public IDP_ISSUER.
OIDCProviderMetadataURL ${IDP_INTERNAL_URL}/.well-known/openid-configuration?internal=1
OIDCProviderTokenEndpointAuth client_secret_basic

OIDCClientID         ${OIDC_CLIENT_ID}
OIDCClientSecret     ${OIDC_CLIENT_SECRET}
OIDCRedirectURI      ${GATE_PUBLIC_URL}/redirect_uri
OIDCCryptoPassphrase ${OIDC_CRYPTO_PASSPHRASE}
OIDCScope            "openid email profile"
OIDCPKCEMethod       S256
OIDCRemoteUserClaim  email
OIDCCookie           gate_session
OIDCSessionInactivityTimeout 28800
OIDCDefaultLoggedOutURL ${GATE_PUBLIC_URL}/
# the site behind only sees who the user is: no sign-in cookies (the provider's included) and no access token
OIDCStripCookies gate_session idp_session

<VirtualHost *:80>
  ProxyPreserveHost On
  RequestHeader unset OIDC_access_token
  RequestHeader unset OIDC_access_token_expires
  <Location />
    AuthType openid-connect
    Require valid-user
  </Location>
  # sign out of the site and the provider:  /redirect_uri?logout=<url>
  ProxyPass        /redirect_uri !
  ProxyPass        / http://${UPSTREAM}/
  ProxyPassReverse / http://${UPSTREAM}/
</VirtualHost>
